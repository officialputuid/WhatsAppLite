[package]
name = "whatsapp-lite"
version = "0.1.2"
edition = "2021"
rust-version = "1.77.2"
description = "Lightweight WhatsApp Web wrapper for Windows"
license = "MIT"

[lib]
name = "whatsapp_lite"
path = "src/lib.rs"

[[bin]]
name = "whatsapp-lite"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(windows)'.dependencies]
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
ureq = { version = "3", features = ["json"] }
webview2-com = "0.38"
windows-core = "0.61"

[target.'cfg(windows)'.build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
